<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 18th Birthday Kavishkaa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Sunset beach gradient background inspired by your reference images */
            background: linear-gradient(180deg, #fcdbb0 0%, #f7b083 40%, #e07b66 70%, #b85c6c 100%);
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            padding: 15px;
            position: relative;
        }

        /* Ambient glowing sunset sun effect behind the content */
        body::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(255,243,212,0.6) 0%, rgba(255,255,255,0) 70%);
            top: 15%;
            z-index: 0;
        }

        /* Container card with a soft frosted-glass overlay to let the sunset show through */
        .poster-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px; /* Kept compact so it frames beautifully on a mobile screen */
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15); 
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* Image styling matching the full-body template look */
        .image-column {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .image-container {
            width: 100%;
            max-width: 320px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            background: #fff;
            padding: 6px; /* White border frame feel */
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
            object-fit: cover;
        }

        /* Typography & Wishes matching the color scheme of your pictures */
        .wishes-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .main-heading {
            font-family: 'Great Vibes', cursive;
            font-size: 4rem;
            color: #9e1b6b; /* Magenta/Burgundy tone from image_4f30de.jpg */
            line-height: 1;
            margin-bottom: 2px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8);
        }

        .sub-heading {
            font-size: 2.2rem;
            font-weight: 600;
            color: #b3893b; /* Luxury gold color from text headings */
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8);
        }

        .stanza-text {
            font-size: 0.95rem;
            line-height: 1.65;
            font-weight: 400;
            color: #4a3e3d;
            margin-bottom: 20px;
            padding: 0 5px;
        }

        .divider {
            width: 80px;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, #b3893b, transparent);
            margin-bottom: 15px;
        }

        .fixed-closing {
            font-family: 'Great Vibes', cursive;
            font-size: 2.4rem;
            color: #9e1b6b;
        }

        /* CSS Floating Confetti Effect elements */
        .confetti {
            position: absolute;
            width: 8px;
            height: 14px;
            background: #ffd700;
            opacity: 0.7;
            border-radius: 2px;
            z-index: 0;
            animation: fall 6s linear infinite;
        }
        
        .c1 { left: 10%; animation-delay: 0s; transform: rotate(15deg); background: #fca1b0; }
        .c2 { left: 25%; animation-delay: 2s; transform: rotate(45deg); background: #ffd700; }
        .c3 { left: 75%; animation-delay: 1s; transform: rotate(-30deg); background: #e6cb95; }
        .c4 { left: 88%; animation-delay: 3.5s; transform: rotate(20deg); background: #fca1b0; }

        @keyframes fall {
            0% { top: -20px; transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { top: 100vh; transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        /* Optimization for very narrow vertical phone devices */
        @media (max-width: 380px) {
            .main-heading { font-size: 3.3rem; }
            .sub-heading { font-size: 1.8rem; }
            .poster-card { padding: 20px 15px; }
        }
    </style>
</head>
<body>

    <!-- Floating Confetti Background Pieces -->
    <div class="confetti c1"></div>
    <div class="confetti c2"></div>
    <div class="confetti c3"></div>
    <div class="confetti c4"></div>

    <div class="poster-card">
        
        <!-- Image positioned at the top for mobile layout screens -->
        <div class="image-column">
            <div class="image-container">
                <img src="photo.png.png" alt="Kavishkaa Photo">
            </div>
        </div>
        
        <!-- Elegant typography section -->
        <div class="wishes-column">
            <h1 class="main-heading">Happy Birthday</h1>
            <h2 class="sub-heading">Kavishkaa</h2>
            
            <p class="stanza-text">
                Wishing you a truly magical day, with the love and joy you so deeply deserve. 
                As you step into adulthood, may every chapter you write be more beautiful than the last, 
                filled of cherished memories and blessings blessings.
            </p>
            
            <div class="divider"></div>
            
            <p class="fixed-closing">Shine bright, always! ♡</p>
        </div>

    </div>

</body>
</html>
